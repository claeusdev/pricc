[package]
name = "pricc"
version = "0.1.0"
edition = "2021"
description = "A very simple C project bootstrapper"
license = "MIT"
repository = "https://github.com/claeusdev/pricc"
categories = ["command-line-utilities"]
keywords = ["cli", "c", "c-project-manager", "c-tooling"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "pricc"
path = "src/main.rs"

[lib]
name = "pricc_generator"
path = "src/lib.rs"
